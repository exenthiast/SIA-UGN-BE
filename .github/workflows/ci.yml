name: API Spec & Collection Validation CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate-specs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate Postman Collection JSON syntax
        run: |
          node -e "JSON.parse(require('fs').readFileSync('api/postman_collection.json', 'utf8')); console.log('Postman Collection JSON syntax is valid!');"
